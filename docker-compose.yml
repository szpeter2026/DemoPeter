# szpeter2026 知识库 — Docker 容器化向量数据库
# 运行: docker compose up -d
# 停止: docker compose down
# 清理数据: docker compose down -v

services:

  # ============================================
  # Chroma 向量数据库（主）
  # ============================================
  chroma:
    image: chromadb/chroma:latest
    container_name: szpeter2026-chroma
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # 数据持久化：向量数据存到本地 db/chroma_docker/
      - ./db/chroma_docker:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
      - PERSIST_DIRECTORY=/chroma/chroma
    # Chroma 镜像精简不含 curl/python，健康检查交给 Docker 端口探测
    # 外部验证: Invoke-RestMethod http://localhost:8000/api/v2/heartbeat
    networks:
      - szpeter2026-net

  # ============================================
  # PostgreSQL + pgvector 向量数据库（备选）
  # 注意：pgvector 是可选方案，不启用可注释掉
  # ============================================
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: szpeter2026-pgvector
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      # 数据持久化：PG 数据存到本地 db/pgdata/
      - ./db/pgdata:/var/lib/postgresql/data
      # 初始化脚本目录：自动创建 extension 和表结构
      - ./db/pg-init:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_USER: szpeter
      POSTGRES_PASSWORD: Szpeter2026!
      POSTGRES_DB: szpeter2026
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U szpeter -d szpeter2026"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - szpeter2026-net

networks:
  szpeter2026-net:
    driver: bridge
